<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Audio Visualizer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="Visualizer-container">
        <h1>Audio Visualizer</h1>
        <input type="file" id="audioFile" accept="audio/*">
        <canvas id="visualizer"></canvas>
        <audio id="audio" controls></audio>
    </div>

    <div class="Controls">
        <label>
            Smoothing:
            <input type="range" id="smoothing" min="0" max="1" step="0.1" value="0.8">
        </label>

        <label>
            Sensitivity:
            <input type="range" id="sensitivity" min="1" max="3" step="0.1" value="1.5">
        </label>

        <label>
            Bar Style:
            <select id="barStyle">
                <option value="classic">Classic Bars</option>
                <option value="rounded">Rounded Bars</option>
                <option value="glow">Glow Bars</option>
                <option value="mirror">Mirror Bars</option>
            </select>
        </label>
    </div>

    <script src="script.js"></script>
</body>
</html>
